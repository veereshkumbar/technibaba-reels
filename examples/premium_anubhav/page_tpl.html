function rowCard(y,p,icon,title,sub,o={}){return PCARD(CX,y,800,138,p,PBADGE(icon,-320,0,o.icol||PR.text,40)+PT(-250,-6,44,title,{a:'start',w:700,fill:o.tfill||PR.text})+PT(-250,36,26,sub,{a:'start',w:500,fill:PR.muted})+(o.right||''),o)}

 for(let k=0;k<6;k++)s+=`<line x1="${-360}" y1="${-200+k*80}" x2="360" y2="${-220+k*86}" stroke="${PR.line2}" stroke-width="${k==2?10:3}"/>`;
 for(let k=0;k<5;k++)s+=`<line x1="${-300+k*150}" y1="-240" x2="${-280+k*140}" y2="300" stroke="${PR.line2}" stroke-width="${k==2?10:3}"/>`;
 [[-220,-120,PR.good],[80,-60,PR.num],[220,160,PR.bad],[-120,180,PR.good],[260,-170,PR.num]].forEach(([x,y,c],i)=>{s+=`<circle cx="${x}" cy="${y}" r="${14}" fill="${c}" opacity="${pin(f,q.map+4+i*2)*.85}"/>`});
 s+='</g>';if(pinOn>0)s+=`<g transform="translate(-20,${30-(1-pinOn)*40})" opacity="${pinOn}">`+PICON('mpin',0,-30,1.1,PR.hl,5)+`</g>`+PPILL(-20,60,'MERA GHAR',pinOn,{size:24,solid:1});return s}

  o+=rowCard(740,pc,'map','TRAI Anubhav',f>=q.as?'speed on a map, by area':'new TRAI website',{on:f>=q.as,icol:PR.good,right:PPILL(250,0,'ASLI SPEED',pin(f,q.as),{solid:1,size:26})});}
 if(n=='rule'){o+=PLABEL(CX,236,'Before you port your SIM');
  const pl=pin(f,q.sh),pr=pin(f,q.sh+8);
  o+=PCARD(315,440,380,250,pl,PBADGE('tv',0,-60,PR.bad,40)+PT(0,24,38,'Ad dekh ke',{w:700})+PT(0,70,28,'port kiya = risk',{w:500,fill:PR.bad}),{state:'bad'});
  o+=PCARD(765,440,380,250,pr,PBADGE('map',0,-60,PR.good,40)+PT(0,24,38,'Gali dekh ke',{w:700})+PT(0,70,28,'port karo',{w:500,fill:PR.good}),{state:'good'});
  const ps=pin(f,q.sh+14,10);o+=PCARD(CX,740,800,190,ps,PBADGE('user',-320,0,PR.text,40)+PT(-250,-22,28,'SEND THIS TO PAPA',{a:'start',w:600,fill:PR.muted,ls:3})+PT(-250,26,34,f>=q.who?'who is thinking of':'',{a:'start',w:700})+PT(-250,68,34,f>=q.prt?'porting the SIM':'',{a:'start',w:700}),{on:1});}

   inner+=PPILL(-200,300,'COMPANY',pin(f,q.cmp),{size:28,solid:f>=q.cmp})+PPILL(110,300,'MOBILE',pin(f,q.mob),{size:28,solid:f>=q.mob});
   o+=browser(pin(f,q.s1-4,10),url,ty,inner);}}
 if(n=='cmp'){o+=PLABEL(CX,226,f>=q.c1?'Example view, not real data':'Two places?');
  const ph=pin(f,q.c0),pw=pin(f,q.c0+8);

function overlay(f){const sp=spAt(f);if(sp>=1)return '';const a=1-sp;
