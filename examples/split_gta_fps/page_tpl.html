function overlay(f){const sp=spAt(f);if(sp>=1)return '';const p=pop(f,-9,9)*(1-sp),s30=f>=WF(0,'sirf'),pr=f>=WF(0,'pro');

  +(pr?stamp(760,640,'PRO PE BHI?!',pop(f,WF(0,'pro'),7),RD,5,52):'')+`</g>`}
const DEFS=`<defs>${FACE.DEFS}${SPLIT_DEFS}<linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${SKY2}"/><stop offset="1" stop-color="${SKY}"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="5"/></filter></defs>`;
