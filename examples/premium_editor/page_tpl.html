function phone(x,y,s,inner){return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-130" y="-230" width="260" height="460" rx="34" fill="${PR.card}" stroke="${PR.line2}" stroke-width="4"/><rect x="-40" y="-214" width="80" height="12" rx="6" fill="${PR.line2}"/>${inner}</g>`}

function row(y,p,num,title,sub,done,o={}){
 return PCARD(CX,y,820,150,p,`<circle cx="-330" cy="0" r="40" fill="${done?PR.good:PR.card2}" stroke="${PR.line2}" stroke-width="2"/>`+PT(-330,14,38,num,{w:800,fill:done?PR.hlText:PR.text})+
  PT(-260,-6,40,title,{a:'start',w:700})+PT(-260,36,26,sub,{a:'start',w:500,fill:PR.muted})+(done?PICON('check',330,0,.6,PR.good,4):''),{on:done&&o.on,state:done?'good':''})}
function content(n,f){let o='';
 if(n=='apk'){o+=PLABEL(CX,226,'CapCut APK? Ruko');
  const pa=pin(f,HOOK_END+2);
  o+=PCARD(CX,420,820,300,pa,PT(-380,-104,24,'BROWSER',{a:'start',w:600,fill:PR.muted,ls:3})+
   `<rect x="-370" y="-76" width="740" height="76" rx="38" fill="${PR.card2}" stroke="${f>=q.kn?PR.bad:PR.line2}" stroke-width="3"/>`+PICON('globe',-320,-38,.45,PR.muted,4)+
   `<text x="-270" y="-24" font-family="Inter" font-weight="600" font-size="38" fill="${PR.text}">capcut<tspan fill="${PR.bad}" font-weight="800">i</tspan>.com</text>`+
   `<g opacity="${pin(f,HOOK_END+8)}"><rect x="-200" y="34" width="400" height="80" rx="18" fill="${PR.card2}" stroke="${PR.line2}" stroke-width="2"/>${PICON('download',-140,74,.5,PR.text,4)}${PT(20,88,36,'Download APK',{w:700})}</g>`+
   PSTRIKE(-210,74,210,pin(f,q.kn+6,8))+(f>=q.kn?PT(260,-100,24,'NAKLI: extra i',{w:700,fill:PR.bad}):''),{state:f>=q.kn?'bad':''});
  o+=PCARD(CX,700,820,190,pin(f,q.kp),PBADGE('hacker',-330,0,PR.bad,50)+PT(-250,-8,48,'Password chori',{a:'start',w:700})+PT(-250,38,26,'fake installer, fake login page',{a:'start',w:500,fill:PR.muted}),{state:'bad'});
  o+=PT(CX,880,28,'Sirf Play Store / App Store',{w:600,fill:PR.good,op:pin(f,q.kp+10)});}
 if(n=='better'){o+=PLABEL(CX,226,'Free editor, bina CapCut');
  o+=PCARD(CX,400,820,250,pin(f,q.v0),PT(-380,-72,24,'ACCHA',{a:'start',w:600,fill:PR.muted,ls:3})+PT(-380,10,96,'VN',{a:'start',w:800})+
   PPILL(80,-10,'Free',pin(f,q.vf),{size:32})+PPILL(80,70,'No watermark',pin(f,q.vw),{size:32})+(f>=q.vf?PICON('check',300,-22,.5,PR.good,4):'')+(f>=q.vw?PICON('check',300,58,.5,PR.good,4):''),{state:f>=q.vw?'good':''});
  const pb=pin(f,q.vp);const lit=f>=q.vb;
  o+=PCARD(CX,700,820,290,pb,PBADGE('star',-330,-40,lit?PR.good:PR.muted,48)+PT(-260,-60,24,'REELS KE LIYE BEST',{a:'start',w:600,fill:lit?PR.good:PR.muted,ls:3})+
   PT(-260,0,44,'Instagram ka apna',{a:'start',w:700,op:pin(f,q.vi)})+PT(-260,50,44,'editor',{a:'start',w:700,op:pin(f,q.vi)})+
   PT(250,110,30,'naam?',{w:600,fill:PR.muted,op:pin(f,q.vi+10)}),{on:lit});}
 if(n=='share'){o+=PLABEL(CX,226,'Send this to');
  o+=PCARD(CX,440,820,300,pin(f,q.s0,10),PBADGE('user',-330,-60,PR.text,48)+PT(-260,-70,46,'Woh dost',{a:'start',w:700})+PT(-260,-22,28,'jo abhi bhi dhoondh raha hai',{a:'start',w:500,fill:PR.muted,op:pin(f,q.sa)})+
   PPILL(0,90,'"CapCut APK bhej na"',pin(f,q.sk),{size:48,col:PR.bad}),{on:f>=q.sd});
  o+=PCARD(CX,750,820,200,pin(f,q.s0+10),PBADGE('shield',-330,0,PR.good,46)+PT(-260,-10,40,'Bhejo, password',{a:'start',w:700})+PT(-260,40,40,'bachao',{a:'start',w:700,fill:PR.good}),{state:'good'});}
 if(n=='reveal'){

   o+=PCARD(CX,640,560,300,pin(f,q.n0+4),PBADGE('film',0,-50,PR.muted,56)+PT(0,90,64,'? ? ?',{w:800,fill:PR.muted}));}
  else {const pe=pin(f,q.e0,8);
   o+=PCARD(CX,360,820,280,pe,PBADGE('film',-300,0,PR.good,64)+PT(-200,20,120,'Edits',{a:'start',w:800})+PT(-196,84,28,'by Instagram · free',{a:'start',w:500,fill:PR.muted}),{on:1});
   o+=PCARD(CX,600,820,120,pin(f,q.ef),PT(-360,14,40,'Free',{a:'start',w:700})+PT(-160,12,26,'iPhone + Android',{a:'start',w:500,fill:PR.muted})+tick(330,0,pin(f,q.ef)),{state:'good'});
   o+=PCARD(CX,740,820,120,pin(f,q.ew),PT(-360,14,40,'No watermark',{a:'start',w:700})+tick(330,0,pin(f,q.ew)),{state:'good'});
   o+=PCARD(CX,880,820,120,pin(f,q.ea),PT(-360,14,40,'Auto captions',{a:'start',w:700})+PPILL(140,10,'1 TAP',pin(f,q.et),{solid:1,size:26})+tick(330,0,pin(f,q.ea)),{state:'good',on:f>=q.et});}}
 if(n=='why'){o+=PLABEL(CX,226,'Reels ke liye kyun');
  o+=PCARD(CX,420,820,240,pin(f,q.w0),PBADGE('music',-320,0,PR.good,58)+PT(-230,-20,46,'Gaane',{a:'start',w:700})+PT(-230,30,30,'Instagram ki library se',{a:'start',w:500,fill:PR.muted,op:pin(f,q.wl)}),{on:f>=q.wl&&f<q.we});
  o+=PARROW(CX,560,CX,pin(f,q.we-6));
  o+=PCARD(CX,720,820,260,pin(f,q.we),PBADGE('arrowOut',-320,0,PR.good,58)+PT(-230,-30,46,'Export',{a:'start',w:700})+PT(-230,22,30,'seedha Instagram pe',{a:'start',w:500,fill:PR.muted,op:pin(f,q.wi)})+PT(-230,64,26,'ya phone mein save',{a:'start',w:500,fill:PR.dim,op:pin(f,q.wi+8)})+
   PPILL(270,-30,'POST',pin(f,q.wi),{solid:1,size:30}),{on:f>=q.wi});}
 if(n=='steps'){o+=PLABEL(CX,226,'4 step · 2 minute');
  o+=row(330,pin(f,q.t0),'1','Edits lo','Play Store / App Store',f>=q.t1,{on:0});
  o+=row(500,pin(f,q.t0+4),'2','Instagram se login','same account',f>=q.t2,{on:0});

  o+=row(840,pin(f,q.t0+12),'4','Export','Instagram pe ya phone mein',f>=q.t3+12,{on:1});}

  const typed='GUIDE'.slice(0,f<q.zg?0:Math.min(5,1+Math.floor((f-q.zg)/3)));
  o+=PCARD(CX,720,820,180,pin(f,q.z0+8),PBADGE('chat',-330,0,PR.text,44)+PT(-260,-30,24,'Add a comment...',{a:'start',w:500,fill:PR.dim})+PT(-260,36,54,typed+(f>=q.zc&&typed.length<5&&Math.floor(f/8)%2?'|':''),{a:'start',w:800,fill:PR.good})+
   PPILL(250,36,'DM mein guide',pin(f,q.zd),{solid:1,size:28}),{on:f>=q.zg});}
 return o}
function overlay(f){const sp=spAt(f);if(sp>=1)return '';const a=1-sp;
 return `<g opacity="${a}">`+PHEAD(540,290,80,'CapCut India mein',f,1,{step:2})+PHEAD(540,390,80,'*ban.* Ab kispe?',f,10,{step:3})+
  PPILL(540,490,'BEST FREE EDITOR · NO APK',pin(f,5),{solid:1,size:34})+
  PCARD(540,640,760,170,pin(f,2),PBADGE('film',-290,0,PR.muted,52)+`<line x1="-326" y1="-36" x2="-254" y2="36" stroke="${PR.bad}" stroke-width="7" stroke-linecap="round"/>`+PT(-210,-10,50,'CapCut',{a:'start',w:800})+PT(-210,40,30,'India mein nahi milta',{a:'start',w:600,fill:PR.bad}),{state:'bad'})+`</g>`}

 let s=`<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">${DEFS}`;
