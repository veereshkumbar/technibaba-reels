const mix=(a,b,t)=>{const h=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));const A=h(a),B=h(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'};
// top-view pitch strip with a ball path: bounce at (0,by); dev = sideways deviation after bounce
function pitch(col,dev,p=1,bal=1){const by=40;let o=`<rect x="-70" y="-150" width="140" height="300" rx="6" fill="${col}" stroke="${PR.line2}" stroke-width="2"/>`+
 `<line x1="-70" y1="-118" x2="70" y2="-118" stroke="#fff" stroke-width="3" opacity=".7"/><line x1="-70" y1="118" x2="70" y2="118" stroke="#fff" stroke-width="3" opacity=".7"/>`;
 if(col.startsWith('#3')||dev>4){for(let k=0;k<9;k++)o+=`<path d="M${-56+k*14},${-140+((k*53)%260)} l3,-10" stroke="#9CE6A8" stroke-width="2" opacity=".5"/>`}
 if(p>0){const t=Math.min(1,p);const y1=-150+(by+150)*Math.min(1,t*2),pre=`M0,-150 L0,${y1}`;
  const t2=Math.max(0,t*2-1),x2=dev*t2,y2=by+(150-by)*t2;
  o+=`<path d="${pre}${t2>0?` Q0,${by+(y2-by)*.4} ${x2},${y2}`:''}" fill="none" stroke="${PR.num}" stroke-width="4" stroke-dasharray="10 8"/>`+
   (t2>0?`<circle cx="0" cy="${by}" r="7" fill="none" stroke="${PR.num}" stroke-width="3"/>`:'')+`<circle cx="${t2>0?x2:0}" cy="${t2>0?y2:y1}" r="12" fill="#C8323C" stroke="#fff" stroke-width="2" opacity="${bal}"/>`}
 return o}
function seamBall(h,s=1){ // side view of the ball, seam height h (px)
 return `<g transform="scale(${s})"><circle cx="0" cy="0" r="60" fill="#B8283A" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>`+
 `<rect x="-${4+h/2}" y="-62" width="${8+h}" height="124" rx="3" fill="#E9E4D6" opacity=".9"/>`+
 [...Array(8)].map((_,k)=>`<line x1="-${6+h}" y1="${-48+k*14}" x2="${6+h}" y2="${-48+k*14}" stroke="#B8283A" stroke-width="2.5"/>`).join('')+`</g>`}

 if(n=='q'){o+=PLABEL(CX,226,'Draw kyun? 3 guess');
  const row=(y,p,ic,t,sub,st,res,rp,o2={})=>PCARD(CX,y,820,170,p,PBADGE(ic,-330,0,st=='bad'?PR.muted:PR.text,44)+PT(-262,-6,44,t,{a:'start',w:700,fill:st=='bad'?PR.muted:PR.text})+PT(-262,36,24,sub,{a:'start',w:500,fill:PR.muted})+
   (st=='bad'?PSTRIKE(-262,-20,180,pin(f,rp,8))+PPILL(300,0,res,pin(f,rp),{size:28,col:PR.bad}):'')+(o2.res2?PPILL(290,0,o2.res2,pin(f,o2.rp2),{solid:1,size:28}):''),{state:o2.state});
  o+=row(360,pin(f,HOOK_END+2),'bat','Bowlers ki galti','Bumrah, Krishna, Sundar...',f>=q.an?'bad':'','NAHI',q.an);
  o+=row(560,pin(f,q.ak-4),'kiwi','Kiwi batting jaadu','Nicholls 175*, Mitchell 49*',f>=q.ab?'bad':'','NAHI',q.ab);
  o+=row(760,pin(f,q.c0),'ball','Pitch + ball',f>=q.cs?'seam ka kaam band':'asli villain','','',0,{state:f>=q.cx?'good':'',res2:'VILLAIN',rp2:q.cx});
  o+=PT(CX,900,24,'Wellington Test, 19-23 Nov 2026',{w:500,fill:PR.dim,op:pin(f,q.c0+6)});}
 if(n=='share'){o+=PLABEL(CX,226,'Send this to');
  o+=PCARD(CX,430,820,320,pin(f,q.sh,10),PBADGE('user',-330,-70,PR.text,48)+PT(-262,-80,46,'Woh dost',{a:'start',w:700})+PT(-262,-34,28,'jo har baar kehta hai',{a:'start',w:500,fill:PR.muted,op:pin(f,q.dost)})+
   PPILL(0,90,'"ZYADA RUN = JEET PAKKI"',pin(f,q.zy),{size:44,col:PR.num}),{on:f>=q.dost});
  o+=PCARD(CX,740,820,200,pin(f,q.jp),PT(-380,-40,24,'IS TEST MEIN',{a:'start',w:600,fill:PR.muted,ls:3})+PT(-380,20,52,'720 run',{a:'start',w:800,fill:PR.num})+PT(-130,20,40,'→ draw',{a:'start',w:700})+PICON('cross',320,0,.7,PR.bad,4),{state:'bad'});}
 if(n=='how'){o+=PHEAD(CX,320,72,'Pitch *hari* thi',f,q.h0,{step:3});

  o+=PCARD(CX,680,560,380,pin(f,q.h0+6),`<g transform="translate(0,0) scale(1)">${pitch('#2F7A45',0,f>=q.hl?Math.min(1,(f-q.hl)/16):0)}</g>`+(f>=q.hl?PPILL(170,-130,'hili?',pin(f,q.hl),{size:30,col:PR.num}):''));}
 if(n=='sun'){o+=PLABEL(CX,226,'Coach Sitanshu Kotak · day 1');
  const dry=Math.max(0,Math.min(1,(f-q.dh)/22));
  o+=PCARD(CX,380,820,170,pin(f,q.s0),PBADGE('sun',-330,0,PR.num,48)+PT(-262,-8,40,'Dhoop ne pitch',{a:'start',w:700})+PT(-262,36,28,'jaldi sukha di',{a:'start',w:600,fill:PR.num,op:pin(f,q.dh)}),{on:f>=q.dh});
  const pw=Math.max(0,(f-q.so-6)/30)%1.6;
  o+=PCARD(315,700,380,400,pin(f,q.so-6),PT(0,-160,26,'GEELI / HARI',{w:600,fill:PR.muted,ls:2})+`<g transform="translate(0,10) scale(.82)">${pitch('#2F7A45',60,Math.min(1,pw))}</g>`+PT(0,175,24,'seam pakadti hai',{w:600,fill:PR.good}),{state:'good'});
  o+=PCARD(765,700,380,400,pin(f,q.so),PT(0,-160,26,'SOOKHI / SAKHT',{w:600,fill:PR.muted,ls:2})+`<g transform="translate(0,10) scale(.82)">${pitch(mix('#2F7A45','#B49A62',dry),0,Math.min(1,pw))}</g>`+PT(0,175,24,f>=q.pk?'ball seedhi nikalti':'',{w:600,fill:PR.bad}),{state:f>=q.pk?'bad':''});}
 if(n=='ball'){o+=PLABEL(CX,226,'Ball ki silai · seam');
  o+=PCARD(315,470,380,400,pin(f,q.kb),PT(0,-150,32,'Kookaburra',{w:700})+PT(0,-112,22,'NZ mein yahi ball',{w:500,fill:PR.muted})+

   PT(330,18,52,ov+'',{w:800,fill:PR.num})+PT(-380,56,22,f>=q.ch?'seam chapti, ball seedhi (Kotak)':'',{a:'start',w:500,fill:PR.muted}),{on:f>=q.ch});}
 if(n=='proof'){o+=PLABEL(CX,226,'NZ dusri innings · 239/5');

  const lit=f>=q.tw?Math.min(20,Math.floor((f-q.tw)/2)):0;
  o+=PCARD(CX,730,820,300,pin(f,q.je),PT(-380,-100,24,'TEST JEETNE KA RULE',{a:'start',w:600,fill:PR.muted,ls:3})+PT(-380,-40,48,'20 wicket chahiye',{a:'start',w:800})+
   [...Array(20)].map((_,k)=>`<circle cx="${-344+(k%10)*76}" cy="${30+Math.floor(k/10)*64}" r="24" fill="${k<lit?PR.good:PR.card2}" stroke="${PR.line2}" stroke-width="2"/>`).join('')+
   PPILL(250,-52,'RUN NAHI',pin(f,q.rn),{solid:1,size:28}),{on:lit>=20});}
 if(n=='end'){o+=PLABEL(CX,226,'Aapka jawab');
  o+=PCARD(CX,430,820,320,pin(f,q.e0),PT(0,-100,44,'Draw ka villain kaun?',{w:700})+PT(0,-50,26,'IND 720/9d · NZ 368 & 239/5',{w:500,fill:PR.muted})+`<g transform="translate(0,60) rotate(90) scale(.5)">${pitch('#B49A62',0,0)}</g>`);
  o+=PCARD(CX,720,820,180,pin(f,q.e0+8),PT(-380,-36,24,'Add a comment...',{a:'start',w:500,fill:PR.dim})+PPILL(-170,36,'PITCH',pin(f,q.ep),{solid:1,size:36})+PPILL(170,36,'BOWLERS',pin(f,q.eb),{size:36}),{on:1});}
 return o}
function overlay(f){const sp=spAt(f);if(sp>=1)return '';const a=1-sp;
 return `<g opacity="${a}">`+PHEAD(540,290,84,'*720* run,',f,1,{step:2})+PHEAD(540,395,84,'phir bhi draw?',f,10,{step:3})+
