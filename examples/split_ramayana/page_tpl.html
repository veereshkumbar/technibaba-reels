 if(n=='q'){o+=head(0,'RAMAYANA: ENGLISH HONTH?',YEL,'#fff7e6');

  const pt=pop(f,q.tr-3,9);o+=box(770,470,400,230,'#fff',pt,T(0,-40,32,'Hindi → English',{font:'Mono',w:700})+T(0,30,40,'TRANSLATE',{fill:GREY})+cross(175,-105,1,pop(f,q.tr,6)),{rot:3,stroke:pt>0?RD:INK});

 if(n=='voice'){o+=head(2,'AWAAZ',YEL,'#f3efff');

  o+=box(540,430,820,260,'#fff',pm,`<g transform="translate(-300,0)"><rect x="-40" y="-90" width="80" height="130" rx="40" fill="${NAVY}" stroke="${INK}" stroke-width="6"/><path d="M-62,10 Q-62,80 0,80 Q62,80 62,10" fill="none" stroke="${INK}" stroke-width="8"/><rect x="-6" y="80" width="12" height="40" fill="${INK}"/></g>`+wave(110,-10,460,f>=q.mic?60:0,f,MD)+T(110,100,34,'Recording · INSAAN',{w:800,fill:MD}),{rot:-1});

 if(n=='lips'){o+=head(3,'HONTH',' #ff9b9b'.trim(),'#fff0ee');

  o+=box(300,560,420,560,'#fff',pf,T(0,-232,30,'SHOOT · HINDI',{w:800,fill:'#7a7f92'})+face(0,30,.95,dots?shape:'aa',dots,INK),{rot:-2});
  if(ai){const pa=pop(f,q.aim,9);o+=`<g transform="translate(540,560) scale(${pa})"><circle r="50" fill="${PURP}" stroke="${INK}" stroke-width="6"/>${T(0,14,38,'AI',{fill:'#fff'})}</g>`}
  if(f>=q.fc+10){const pe=pop(f,q.fc+10,9);o+=box(790,560,400,560,'#fff',pe,T(0,-232,30,'SCREEN · ENGLISH',{w:800,fill:'#7a7f92'})+face(0,30,.9,en?seq[(Math.floor(f/5)+2)%4]:'mm',0,en?PURP:INK)+(!ai?T(0,262,40,'? ? ?',{fill:GREY}):'')+(en?T(0,250,34,'sirf honth badle',{fill:PURP}):''),{rot:2,stroke:en?PURP:INK})}

  const late=f>=q.dost,sh=late?sm(f,q.dost-2,10):0;
  [['Script: naya likha',q.r1],['Awaaz: insaan ki',q.r2],['Honth: AI ne milaaye',q.r3]].forEach(([lab,fr],k)=>{const p=pop(f,F(9)+k*4,9),tk=pop(f,fr,8);o+=box(540,372+k*(150-34*sh),800,126-20*sh,'#fff',p,`<rect x="-370" y="-34" width="68" height="68" rx="16" fill="${tk>0?MINT:'#f3f4f8'}" stroke="${INK}" stroke-width="5"/>`+(tk>0?`<path d="M-354,2 l14,15 l28,-32" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="70" stroke-dashoffset="${70*(1-clamp(tk))}"/>`:'')+T(-270,17,46,lab,{a:'start'}),{rot:k%2?1:-1})});

 for(let r=0;r<2;r++)for(let k=-2;k<14;k++){o+=`<rect x="${k*110-40+r*55}" y="${1640+r*90}" width="96" height="140" rx="30" fill="${r?'#8c2238':'#a42a44'}" stroke="#5c1424" stroke-width="5"/>`}
 return o}
