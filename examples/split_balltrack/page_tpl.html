  const pl=clamp((f-q.line5)/14);if(f>=q.line5){[A,B].forEach(S=>{const ex=S[0]+(P[0]-S[0])*pl*1.15,ey=S[1]+(P[1]-S[1])*pl*1.15;o+=`<line x1="${S[0]}" y1="${S[1]}" x2="${ex}" y2="${ey}" stroke="${YEL}" stroke-width="10" stroke-dasharray="26 14" stroke-linecap="round"/>`})}
