 else o+=`<circle cx="${TLX}" cy="${MY}" r="46" fill="#fff" stroke="${ACC}" stroke-width="6" opacity="${prog(t,LS(1)+.35,LS(1)+.5)}"/>`;
 return o+`</g>`}
// ---- captions (top, word-by-word, keywords boxed in serif italic) ------
const CH=LINES.map(L=>{const w=words(L.i),st=wordStarts(L.i);const ch=[];let cur=[];w.forEach((x,k)=>{cur.push(k);if(cur.length>=3||cur.map(q=>w[q]).join(' ').length>=20||(/[,.!?]"?$/.test(x)&&cur.length>=2))ch.push(cur),cur=[]});if(cur.length){if(cur.length==1&&ch.length)ch[ch.length-1].push(cur[0]);else ch.push(cur)}return ch.map(c=>({ks:c,s:st[c[0]]}))});
function caption(t){const L=lineAt(t);if(!L)return'';const ch=CH[L.i],ws=words(L.i),st=wordStarts(L.i);let ci=0;ch.forEach((c,k)=>{if(t>=c.s-.05)ci=k});const c=ch[ci],a=t<.2?1:eo(prog(t,c.s-.05,c.s+.16));
 const sp=c.ks.map(k=>{const w=ws[k],core=w.replace(/[^A-Za-z0-9\-]/g,''),kw=core.length>1&&core==core.toUpperCase()&&/[A-Z]/.test(core),on=t>=st[k]-.03||(t<LINES[0].start+.1&&L.i==0&&c.ks.includes(k));return `<span class="${kw?'kw ':''}${on?'on':''}">${w.replace(/[.,]$/,m=>kw?'':m)}</span>`}).join(' ');
 const tl=sceneIdx(t),x0=(ORDER[tl]!='hook'&&ORDER[tl]!='recap'&&ORDER[tl]!='cta')?160:60;
 return `<foreignObject x="${x0}" y="${236+10*(1-a)}" width="${1080-x0-60}" height="220" opacity="${a}"><div xmlns="http://www.w3.org/1999/xhtml" class="cap">${sp}</div></foreignObject>`}

// ---- frame --------------------------------------------------------------
const DEFS=`<defs><pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54,0 L0,0 0,54" fill="none" stroke="#eceef4" stroke-width="2"/></pattern>
<radialGradient id="gSkin" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#ffe0bf"/><stop offset=".7" stop-color="#f4c193"/><stop offset="1" stop-color="#df9f72"/></radialGradient>
<radialGradient id="gFace" cx="40%" cy="35%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e6ddcb"/></radialGradient>
<linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e2a80"/><stop offset="1" stop-color="#0c0a30"/></linearGradient>
<linearGradient id="gEnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9f5e3"/></linearGradient>
<radialGradient id="gFade" cx="50%" cy="45%" r="75%"><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></radialGradient>
<filter id="fSh" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="16"/></filter></defs>`;
function render(t){const k=sceneIdx(t),n=ORDER[k],S=SC[n];let o=DEFS+`<rect width="1080" height="1920" fill="#fbfbfd"/><rect width="1080" height="1920" fill="url(#grid)"/>`;
 if(n=='cta'||(n=='recap'&&0)){const p=prog(t,S.s,S.s+.5);o+=`<rect width="1080" height="1920" fill="url(#gEnd)" opacity="${p}"/>`}
 o+=`<rect width="1080" height="1920" fill="url(#gFade)"/>`+timeline(t);
 const p=k==0?1:eo(prog(t,S.s,S.s+.45));
 if(k>0&&p<1)o+=`<g opacity="${1-p}" transform="translate(0,${-240*p})">${FN[ORDER[k-1]](t)}</g>`;
 o+=`<g opacity="${p}" transform="translate(0,${240*(1-p)})">${FN[n](t)}</g>`;
 o+=caption(t);
 document.getElementById('root').innerHTML=`<svg width="1080" height="1920" viewBox="0 0 1080 1920">${o}</svg>`}
// ---- sfx ----------------------------------------------------------------
ORDER.forEach((n,k)=>{if(k)sfx(SC[n].s,'whoosh')});sfx(W(0,'otp'),'thud');[2,4,6,8,10].forEach(i=>sfx(LS(i)+.1,'pop'));
sfx(W(2,'two')+.15,'tick');for(let k=0;k<6;k++)sfx(W(2,'pin')+.1+k*.11,'type');sfx(W(3,'nahi'),'thud');sfx(W(5,'logout'),'tick');sfx(W(5,'logout')+.4,'ding');sfx(W(6,'my'),'tick');sfx(W(7,'nahi'),'crack');sfx(W(8,'silence'),'tick');sfx(W(9,'bajega'),'fall');sfx(W(10,'mat'),'thud');['bank','courier','galti'].forEach(w=>sfx(W(11,w)+.35,'blip'));
STEPS.forEach((s,k)=>sfx(LS(12)+.1+k*(LINES[12].dur-.9)/STEPS.length,'pop'));sfx(W(12,'safe'),'ding');for(let k=0;k<4;k++)sfx(W(13,'safe')+k*.1,'type');sfx(W(14,'family'),'pop');
window.render=render;window.SFX=SFX;window.TOTAL=TOTAL;
</script></body></html>
