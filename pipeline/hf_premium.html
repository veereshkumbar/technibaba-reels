<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script>__GSAP__</script>
<style>
@font-face{font-family:Pop;font-weight:600;src:url(assets/pop600.woff2)}
@font-face{font-family:Pop;font-weight:800;src:url(assets/pop800.woff2)}
@font-face{font-family:Pop;font-weight:900;src:url(assets/pop900.woff2)}
@font-face{font-family:Mono;font-weight:700;src:url(assets/mono700.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(assets/inter400.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(assets/inter600.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(assets/inter700.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(assets/inter800.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B0A2E}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px}
.layer svg,.page svg{display:block}
svg text{font-family:Inter}
#strip{}
#panelwrap{will-change:transform}
#pclip{position:absolute;left:72px;top:150px;width:936px;height:835px;border-radius:36px;overflow:hidden;background:linear-gradient(160deg,rgba(46,42,128,.78),rgba(16,14,62,.88));box-shadow:0 30px 80px rgba(3,2,20,.65),0 0 0 2px rgba(93,224,176,.28),0 0 60px rgba(93,224,176,.12)}
#pframe{position:absolute;left:72px;top:150px;width:936px;height:835px;border-radius:36px;background:linear-gradient(180deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,0) 22%);pointer-events:none}
.page{position:absolute;left:0;top:0;width:936px;height:835px}
.cap{position:absolute;left:540px;display:flex;align-items:center;justify-content:center;padding:0 .55em;white-space:pre;font-family:Inter;font-weight:800;letter-spacing:-.02em;color:#fff;background:rgba(11,10,46,.82);border:1.5px solid rgba(93,224,176,.35);box-shadow:0 18px 50px rgba(3,2,20,.6);z-index:60}
.cap .w{display:inline-block;white-space:pre}
.cap .kw{color:#0B0A2E;background:#5DE0B0;border-radius:.18em;padding:.02em .22em;display:inline-block}
#fx{z-index:55}
#grade{z-index:80;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 55%,rgba(5,4,26,.5) 100%)}
#leak{z-index:79;opacity:0;mix-blend-mode:screen;overflow:hidden}
#leak .lk{position:absolute;inset:-20%}
#leak .lk1{background:radial-gradient(ellipse 50% 100% at 12% 55%,rgba(200,255,235,.85),transparent 45%),radial-gradient(ellipse 70% 120% at 26% 52%,rgba(93,224,176,.7),transparent 66%);filter:blur(28px)}
#leak .lk2{background:radial-gradient(ellipse 58% 100% at 80% 34%,rgba(122,108,255,.75),rgba(122,108,255,.25) 48%,transparent 76%);filter:blur(40px)}
#leak .lk3{background:linear-gradient(104deg,transparent 26%,rgba(93,224,176,.25) 40%,rgba(255,255,255,.55) 51%,rgba(122,108,255,.2) 62%,transparent 78%);filter:blur(20px)}
#follow{z-index:85;position:absolute;left:540px;top:1560px;transform:translateX(-50%);display:flex;align-items:center;gap:26px;background:rgba(11,10,46,.92);border:1.5px solid rgba(93,224,176,.4);border-radius:80px;padding:22px 26px 22px 22px;box-shadow:0 20px 60px rgba(3,2,20,.7);opacity:0;font-family:Inter}
#follow .av{width:112px;height:112px;border-radius:50%;background:#2E2A80;border:3px solid #5DE0B0;overflow:hidden}
#follow .nm{white-space:nowrap;font-size:40px;font-weight:800;color:#fff;letter-spacing:-.02em}
#follow .hd{white-space:nowrap;font-size:28px;font-weight:500;color:#A9A6D9}
#follow .bt{white-space:nowrap;margin-left:18px;font-size:32px;font-weight:800;padding:18px 40px;border-radius:40px;background:#5DE0B0;color:#0B0A2E;position:relative}
#follow .bt2{position:absolute;inset:0;border-radius:40px;background:#262273;color:#fff;display:flex;align-items:center;justify-content:center;opacity:0}
#follow .tap{position:absolute;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.5);right:50px;top:30px;opacity:0}
#sheen{z-index:81;background:none}
#grain{z-index:82;opacity:.05;mix-blend-mode:overlay}
#prog{position:absolute;left:0;top:1912px;width:1080px;height:8px;background:#5DE0B0;opacity:.9;z-index:90;transform-origin:0 50%}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">
  <div id="strip" class="layer"></div>
  <div id="chars" class="layer" style="z-index:5"></div>
  <div id="panelwrap" class="layer" style="z-index:20">
    <div id="pbg" class="layer"></div>
    <div id="pclip">
__PAGES__    </div>
    <div id="pframe"></div>
  </div>
  <div id="fx" class="layer"></div>
__CAPS__  <div id="leak" class="layer"><div class="lk lk1"></div><div class="lk lk2"></div><div class="lk lk3"></div></div><div id="follow"><div class="av" id="fav"></div><div><div class="nm">Techni Baba</div><div class="hd">@technibaba</div></div><div class="bt">Follow<div class="bt2">Following</div><div class="tap"></div></div></div><div id="grade" class="layer"></div><div id="sheen" class="layer"></div>
  <div id="grain" class="layer"><svg width="1080" height="1920"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1920" filter="url(#gr)"/></svg></div>
  <div id="prog"></div>
  <audio id="mix" class="clip" data-start="0" data-duration="__DUR__" data-track-index="9" data-volume="1" src="assets/mix.wav"></audio>
</div>
<script>
__SCRIPT__
// ================= HyperFrames driver =================
const DUR=NF/FPS,$=id=>document.getElementById(id),SVG=(vb,inner)=>`<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="${vb}">${inner}</svg>`;
// static panel backdrop (brand premium)
(()=>{let o=`<defs>${PDEFS}</defs><rect x="-40" y="-1300" width="1160" height="${SEAM+1300}" fill="${PR.bg}"/><ellipse cx="540" cy="560" rx="760" ry="620" fill="url(#pspot)"/>`+PDOTS(0,0,1080,SEAM-4)+`<rect x="0" y="${SEAM-1}" width="1080" height="2" fill="#5DE0B0" opacity=".35"/>`;$('pbg').innerHTML=SVG('0 0 1080 1920',o);$('pframe').innerHTML=SVG('72 150 936 835',PCORNERS(90,168,990,967,34,.5))})();
// follow-card avatar: Baba's head
$('fav').innerHTML=SVG('0 0 112 112',`<defs>${FACE.DEFS}</defs><g transform="translate(56,300) scale(.52)">`+CAST.b.draw(0,{x:0,y:0,s:1,flip:false,phone:false,glow:0})+`</g>`);
const PAGES=[...document.querySelectorAll('.page')].map(el=>({el,n:el.dataset.scene,on:false}));
function draw(t){const f0=Math.round(t*FPS),f=warp(f0);
 $('strip').innerHTML=SVG('0 0 1080 1920',`<defs>${PDEFS}</defs><g transform="${camG(f)}">${strip(f)}</g>`);
 $('chars').innerHTML=SVG('0 0 1080 1920',`<defs>${FACE.DEFS}${PDEFS}</defs>`+charLayer(f,null));
 PAGES.forEach(p=>{const on=f>=SCF[p.n].s-2&&f<=SCF[p.n].e+14;if(on)p.el.innerHTML=SVG(`${PAN.x0} ${PAN.y0} ${PAN.x1-PAN.x0} ${PAN.y1-PAN.y0}`,`<defs>${PDEFS}</defs>`+content(p.n,f));else if(p.on)p.el.innerHTML='';p.on=on});
 $('fx').innerHTML=SVG('0 0 1080 1920',`<defs>${PDEFS}</defs>`+overlay(f))}
const driver={_t:0,get t(){return this._t},set t(v){this._t=v;draw(v)}};
const tl=gsap.timeline({paused:true});
tl.to(driver,{t:DUR,duration:DUR,ease:"none"},0);
tl.fromTo("#prog",{scaleX:0},{scaleX:1,duration:DUR,ease:"none"},0);
// panel drops in after the full-screen hook
const hookT=HOOK_END/FPS;
tl.set("#panelwrap",{y:70,opacity:0},0);
tl.to("#panelwrap",{y:0,opacity:1,duration:.5,ease:"power3.out"},hookT);
// page transitions: blur-through with a brand light-leak sweep
const leakAt=(t0,d=1.1)=>{tl.fromTo("#leak",{opacity:0},{opacity:.42,duration:d*.3,ease:"sine.out"},t0);tl.to("#leak",{opacity:0,duration:d*.5,ease:"sine.in"},t0+d*.45);tl.fromTo("#leak .lk1",{xPercent:-25},{xPercent:20,duration:d,ease:"sine.inOut"},t0);tl.fromTo("#leak .lk2",{xPercent:20},{xPercent:-18,duration:d,ease:"sine.inOut"},t0);tl.fromTo("#leak .lk3",{xPercent:-30},{xPercent:26,duration:d,ease:"sine.inOut"},t0)};
PAGES.forEach((p,k)=>{if(!k)return;const a=PAGES[k-1].el,b=p.el,t0=SCF[p.n].s/FPS;
 tl.to(a,{opacity:0,y:-30,scale:.97,filter:"blur(14px)",duration:.3,ease:"power2.in"},t0);tl.fromTo(b,{opacity:0,y:40,scale:.97,filter:"blur(14px)"},{opacity:1,y:0,scale:1,filter:"blur(0px)",duration:.5,ease:"power3.out"},t0+.12);leakAt(t0-.15)});
leakAt(hookT-.2,1.2);
// hit: a short push-in on the panel instead of a shake
HITS.forEach(([h])=>{const t0=h/FPS;leakAt(t0-.05,.9);tl.to("#panelwrap",{scale:1.025,duration:.12,ease:"power2.out"},t0);tl.to("#panelwrap",{scale:1,duration:.4,ease:"power3.out"},t0+.14)});
// captions pop on the seam
for(let k=0;k<__NCAPS__;k++){const el=$('cap-'+k),t0=+el.dataset.start;gsap.set(el,{xPercent:-50});tl.fromTo(el,{opacity:0,y:14},{opacity:1,y:0,duration:.2,ease:"power3.out"},t0);tl.fromTo(el.querySelectorAll(".w"),{opacity:0,y:22,filter:"blur(6px)"},{opacity:1,y:0,filter:"blur(0px)",duration:.22,stagger:.05,ease:"power3.out"},t0);const kw=el.querySelectorAll(".kw");if(kw.length)tl.fromTo(kw,{scale:.6},{scale:1,duration:.35,ease:"back.out(2.4)"},t0+.08)}
const fT=Math.max(0,DUR-2.4);tl.fromTo("#follow",{opacity:0,y:60,scale:.9},{opacity:1,y:0,scale:1,duration:.5,ease:"back.out(1.6)"},fT);tl.fromTo("#follow .tap",{opacity:.0,scale:.3},{opacity:.7,scale:1,duration:.18,ease:"power2.out"},fT+1.1);tl.to("#follow .tap",{opacity:0,scale:1.6,duration:.3},fT+1.3);tl.to("#follow .bt",{scale:.92,duration:.08},fT+1.1);tl.to("#follow .bt",{scale:1,duration:.25,ease:"back.out(3)"},fT+1.18);tl.to("#follow .bt2",{opacity:1,duration:.12},fT+1.2);
window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;tl.seek(0);draw(0);
</script>
</body></html>
